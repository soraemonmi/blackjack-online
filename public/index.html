<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><title>BLACKJACK ONLINE</title></head>
<body><div id="app"><header class="topbar"><div class="brand"><div class="brand-mark">♠</div><div class="brand-title">BLACKJACK ONLINE</div></div><div id="roomLabel" class="conn">● 未接続</div></header><main>
<section id="joinView" class="panel join-panel"><h1>BLACKJACK ONLINE</h1><p class="join-sub">最大20人。プレイヤーと観戦者が同じテーブルに参加できるリアルタイム・ブラックジャック。</p><div class="field"><span>プレイヤー名</span><input id="name" maxlength="16" placeholder="名前を入力"></div><div class="field"><span>ルームコード</span><input id="room" maxlength="5" placeholder="空欄なら新しい部屋" style="text-transform:uppercase"></div><label class="check"><input id="spectate" type="checkbox"> 観戦者として参加</label><div style="height:8px"></div><button id="joinBtn" class="primary" style="width:100%">ルームに入る</button><p class="small">ゲーム内チップのみ。現金・換金には対応していません。</p></section>
<section id="gameView" class="hidden"><div id="matchEdgeControls" class="match-edge-controls hidden"><button id="matchMenuBtn" class="edge-btn menu-btn" type="button" aria-label="メニュー">☰</button><button id="matchRestartBtn" class="edge-btn restart-edge" type="button" aria-label="リスタート">↻</button><button id="matchLeaveBtn" class="edge-btn leave-edge" type="button" aria-label="退出">×</button></div><div class="layout"><div class="maincol">
<section class="panel lobby-controls"><div class="room-code-card"><div><span class="room-label">ROOM ID</span><strong id="roomCodeDisplay">-----</strong></div><button id="copyRoomBtn" type="button">コピー</button></div><div class="row wrap"><span id="phase" class="badge phase-badge">LOBBY</span><span class="badge">ROUND <b id="round">0</b>/<span id="maxRound">5</span></span><span id="roleBadge" class="badge"></span><span class="spacer"></span><button id="startBtn" class="primary">START</button><button id="restartBtn">RESTART</button><button id="leaveBtn" class="danger">退出</button></div><div id="hostSettings" class="host-settings hidden"><div class="host-settings-title">HOST SETTINGS　<span>このルームのID：<b id="hostRoomCode">-----</b></span></div><label>モード<select id="mode"><option value="normal">通常対戦</option><option value="continuous">連戦</option><option value="tournament">トーナメント</option></select></label><label>ラウンド<input id="rounds" type="number" min="1" max="99" value="5"></label><label>初期コイン<input id="initialCoins" type="number" min="100" step="100" value="10000"></label><label>最低BET<input id="minBet" type="number" min="1" step="100" value="100"></label><label>最高BET<input id="maxBet" type="number" min="1" step="100" value="5000"></label><label>ディーラー<select id="dealer"><option value="cpu">CPUディーラー</option></select></label><button id="applySettings" class="gold">設定反映</button></div></section>
<section id="table" class="table panel"><div class="dealer-area"><div class="dealer-title">DEALER <span id="dealerName" class="dealer-name">CPU Dealer</span></div><div id="dealerHand" class="cards"></div><div id="dealerScore" class="score"></div><div id="dealerControls" class="actions hidden"><button class="action-btn hit" data-action="hit">HIT</button><button class="action-btn stand" data-action="stand">STAND</button></div></div><div class="divider"></div><div id="playersArea" class="seat-grid"></div></section>
<section class="panel action-panel"><div class="section-title"><h3>YOUR ACTION</h3><span id="timerText" class="countdown"></span></div><div id="betArea" class="bet-area"></div><div id="actionArea" class="actions"></div><div id="actionStatus" class="status"></div></section>
</div><aside class="sidecol"><section class="panel side-panel"><div class="section-title"><h3>参加者</h3><span class="badge">最大20</span></div><div id="users" class="users-list"></div></section><section class="panel side-panel chat-panel"><div class="section-title"><h3>CHAT</h3></div><div id="chatLog" class="chat-log"></div><div class="chat-row"><input id="chatInput" maxlength="120" placeholder="メッセージ"><button id="chatBtn" class="primary">送信</button></div></section><section class="panel side-panel audio-panel"><button id="bgmBtn">BGM OFF</button><button id="voiceBtn">VOICE ON</button><button id="installBtn" class="hidden wide">ホーム画面に追加</button></section></aside></div></section></main></div><div id="toast"></div><script>window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__installPrompt=e;document.getElementById('installBtn').classList.remove('hidden');document.getElementById('installBtn').onclick=async()=>{await e.prompt();document.getElementById('installBtn').classList.add('hidden')}})</script><script src="/client.js"></script></body></html>
